              description: Placeholder
              config:
                severity: error

      - name: sub_category_key
        description: Placeholder
        data_tests:
          - not_null:
              description: Placeholder
              config:
                severity: warn



  - name: silver_stores
    description: Cleaned and transformed version of the stores data from bronze layer.

    columns:
      - name: store_key
        description: Placeholder
        data_tests: 
          - unique:
