models:
  - name: silver_customers
    description: Cleaned and transformed version of the customers data from bronze layer.

    columns:
      - name: customer_id
        description: >
          This is the primary key of the silver_customers table, sourced from the CustomerKey column in the bronze layer. 
          Each value corresponds to one distinct customer entity.
        data_tests:
          - not_null:
              description: This checks that customer key can never be null.
              config:
                severity: error
          - unique:
              description: Unique validates the customer key to always be unique and stores failed tests
              config:
                severity: error


      - name: gender
        description: This column is the value corresponding to Gender column from bronze layer.
        data_tests:
          - not_null:
              description: Checks that the gender column can never be null.
              config:
                severity: warn
          - accepted_values:
              description: Validates that gender column contains only approved business values.
              arguments:
                values: ['Female', 'Male']
              config: 
                severity: warn

      - name: customer_name
        description: This column is the value corresponding to Name column from bronze layer.
        data_tests:
          - not_null:
              description: Customer must have a name.
              config:
                severity: error

      - name: city
        description: This column is the value corresponding to City column from bronze layer.
        data_tests:
          - not_null:
              description: Customer city can never be null as orders needs a location.
              config:
                severity: error

      - name: state_code
        description: This column is the value corresponding to StateCode column from bronze layer.
        data_tests:
          - not_null:
              description: State Code 
              config:
                severity: warn

      - name: zip_code
        description: This column is the value corresponding to ZipCode column from bronze layer.
        data_tests:
          - not_null: 
              description: Zip code can't be null.
              config:
                severity: error

      - name: country
        description: This column is the value corresponding to ZipCode column from bronze layer.
        data_tests:
          - not_null:
              description: This column can never be null as shipped products needs a destination
              config:
                severity: error

      - name: continent
        description: This column is the value corresponding to Continent column from bronze layer.
        data_tests:
          - not_null:
              description: Even if this column is null, the severity is warn
              config:
                severity: warn

      - name: birthday
        description: This column is the value corresponding to Birthday column from bronze layer.
        data_tests:
          - not_null:
              description: Birthday cannot be null
              config:
                severity: warn

  - name: silver_products
    description: >
      Cleaned, standardized and validated version of the products data from bronze layer for downstream analytics
    
    columns:
      - name: product_id
        description: This column is the value corresponding to PRODUCTKEY column from bronze layer.
        data_tests:
          - unique:
              description: Ensures every product has a unique identifier.
              config:
                severity: error
          - not_null:
              description: Gaurantees that product key can never be null.
              config:
                severity: error

      - name: product_name
        description: This column is the value corresponding to PRODUCTNAME column from bronze layer.
        data_tests:
          - not_null:
              description: Validates that every product has a name
              config:
                severity: error
          
      - name: brand
        description: This column is the value corresponding to BRAND column from bronze layer.
        data_tests:
          - not_null:
              description: Every product must have a brand. This test ensures that this column can't be null
              config: 
                severity: error

      - name: color
        description: >
            The colors of each product. This column is the corresponding value to the Color column from bronze layer.
        data_tests:
          - not_null:
              description: Verifies that this column is not null as each product should have a color.
              config:
                severity: warn

      - name: unit_cost_usd
        description: Standardized version of this column and transformed to int data type.
        data_tests:
          - not_null:
              description: Confirms that this column should never be null
              config:
                severity: error
          
      - name: unit_price_usd
        description: Standardized version of this column and transformed to int data type.
        data_tests:
          - not_null:
              description: Ensures every product has a unit price in usd.
              config:
                severity: error

      - name: category_id
        description: Product category in the products model.
        data_tests:
          - not_null:
              description: Validates that this column is not null.
              config:
                severity: error

      - name: category
        description: Each row belongs to a product. This model is standardized and unique.
        data_tests:
          - not_null:
              description: Detects and also prevents null values in this column
              config:
                severity: error

      - name: sub_category_id
        description: Sub-Product category in the products model.
        data_tests:
          - not_null:
              description: Validates that this column is not null.
              config:
                severity: warn

      - name: sub_category
        description: Cleaned and standardized sub-category names
        data_tests:
          - not_null:
              description: Prevents this column from having empty rows
              config:
                severity: warn



  - name: silver_stores
    description: Cleaned and transformed version of the stores data from bronze layer for downstream analytics.

    columns:
      - name: store_id
        description: Unique identifier assigned to each store.
        data_tests: 
          - unique:
              description: Ensures each store has a unique identifier
              config:
                severity: error
          - not_null:
              description: Prevents this column from having null rows.
              config:
                severity: error

      - name: country
        description: >
          This column is the value corresponding to the Country column from the bronze layer, 
          cleaned via initcap(trim(...)). It stores the name of the country where the store is physically located.
        data_tests:
          - not_null:
              description: Validates that every store has a country.
              config:
                severity: error

      - name: state
        description: Recognizes the state where the stores are located
        data_tests:
          - not_null:
              description: Ensures that the column is not null as stores should have locations.
              config:
                severity: error

      - name: square_meters
        description: This column depicts the size of the each store.
 

      - name: open_date
        description: >
            This column is the value corresponding to the OpenDate column from the bronze layer. 
            Stores the date when the each store opened
        data_tests:
          - not_null:
              description: To preserve history, this test ensures every store has an open date.
              config:
                severity: error

