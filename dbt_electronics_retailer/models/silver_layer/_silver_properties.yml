models:
  - name: silver_customers
    description: >
      Contains cleansed and standardized customer records derived from the bronze layer. 
      Text attributes are normalized, data types are converted, and themodel provides a 
      consistent customer dataset for downstream dimensional.

    columns:
      - name: customer_id
        description: >
          This is the primary key of the silver_customers table, sourced from the CustomerKey column in the bronze layer. 
          Each value corresponds to one distinct customer entity.
        data_tests:
          - not_null:
              description: Ensures every customer record has a valid customer identifier.
              config:
                severity: error
          - unique:
              description: Confirms that each customer identifier appears only once in the model and stores failed tests
              config:
                severity: error


      - name: gender
        description: >
          Customer gender standardized to approved values.
          This column is the value corresponding to Gender column from bronze layer.
        data_tests:
          - not_null:
              description: Checks that the gender column can never be null.
              config:
                severity: warn
          - accepted_values:
              description: Validates that gender column contains only approved business values.
                
              arguments:
                values: ['Female', 'Male']
              config: 
                severity: warn

      - name: customer_name
        description: >
          Full name of the customer after trimming whitespace and standardizing formatting.
          This column is the value corresponding to Name column from bronze layer.
        data_tests:
          - not_null:
              description: Customer must have a name.
              config:
                severity: error

      - name: city
        description: >
          City associated with the customer's primary address after trimming whitespace and standardizing formatting.
          This column is the value corresponding to City column from bronze layer.
        data_tests:
          - not_null:
              description: Customer city can never be null as orders needs a location.
              config:
                severity: error

      - name: state_code
        description: Abbreviated code representing the customer's state or province.
        data_tests:
          - not_null:
              description: State Code 
              config:
                severity: warn

      - name: state
        description: Full name of the customer's state or province after text standardization.
        data_tests:
          - not_null:
              description: placeholder
              config:
                severity: error

      - name: zip_code
        description: ZIP code associated with the customer's address.
        data_tests:
          - not_null: 
              description: Zip code can't be null.
              config:
                severity: error

      - name: country
        description: Country where the customer resides.
        data_tests:
          - not_null:
              description: This column can never be null as shipped products needs a destination
              config:
                severity: error

      - name: continent
        description:  Continent associated with the customer's country.
        data_tests:
          - not_null:
              description: Even if this column is null, the severity is warn
              config:
                severity: warn

      - name: birthday
        description: Customer date of birth converted to the DATE data type.
        data_tests:
          - not_null:
              description: Birthday cannot be null
              config:
                severity: warn

  - name: silver_products
    description: >
      Contains cleansed and standardized product records derived from the bronze layer. 
      Text attributes are normalized, currency values are converted to numeric data types, 
      and product classifications are prepared for dimensional modeling.
    
    columns:
      - name: product_id
        description: Unique business identifier assigned to each product by the source system.
        data_tests:
          - unique:
              description: Ensures every product has a unique identifier.
              config:
                severity: error
          - not_null:
              description: Gaurantees that product key can never be null.
              config:
                severity: error

      - name: product_name
        description: Product name after trimming whitespace and standardizing text formatting.
        data_tests:
          - not_null:
              description: Validates that every product has a name
              config:
                severity: error
          
      - name: brand
        description: Brand associated with the product after text normalization.
        data_tests:
          - not_null:
              description: Every product must have a brand. This test ensures that this column can't be null
              config: 
                severity: error

      - name: color
        description: Standardized color assigned to the product.
        data_tests:
          - not_null:
              description: Verifies that this column is not null as each product should have a color.
              config:
                severity: warn

      - name: unit_cost_usd
        description: Product unit cost converted to a numeric value in U.S. dollars.
        data_tests:
          - not_null:
              description: Confirms that this column should never be null
              config:
                severity: error
          - test_negative_values:
              arguments:
                column_name: unit_cost_usd
              description: Validates that product unit cost is not 0 or a negative value.
              config:
                severity: error

          
      - name: unit_price_usd
        description: Product selling price converted to a numeric value in U.S. dollars.
        data_tests:
          - not_null:
              description: Ensures every product has a unit price in usd.
              config:
                severity: error
          - test_negative_values:
              arguments:
                column_name: unit_price_usd
              description: Validates that unit price of a product is not 0 or a negative value.
              config:
                severity: error

      - name: category_id
        description: Business identifier representing the product category.
        data_tests:
          - not_null:
              description: Validates that this column is not null.
              config:
                severity: error

      - name: category
        description: Standardized product category name.
        data_tests:
          - not_null:
              description: Detects and also prevents null values in this column
              config:
                severity: error

      - name: sub_category_id
        description: Business identifier representing the product subcategory.
        data_tests:
          - not_null:
              description: Validates that this column is not null.
              config:
                severity: warn

      - name: sub_category
        description: Standardized product subcategory name.
        data_tests:
          - not_null:
              description: Prevents this column from having empty rows
              config:
                severity: warn



  - name: silver_stores
    description: >
      Contains cleansed and standardized store records derived from the bronze layer. 
      Text attributes are normalized, data types are converted, and the model provides a 
      consistent store dataset for downstream dimensional modeling.

    columns:
      - name: store_id
        description: Unique business identifier assigned to each store by the source system.
        data_tests: 
          - unique:
              description: Ensures each store has a unique identifier
              config:
                severity: error
          - not_null:
              description: Prevents this column from having null rows.
              config:
                severity: error

      - name: country
        description: Country where the store is located after text standardization.
        data_tests:
          - not_null:
              description: Validates that every store has a country.
              config:
                severity: error

      - name: state
        description: The state where the store is located after text standardization
        data_tests:
          - not_null:
              description: Ensures that the column is not null as stores should have locations.
              config:
                severity: error

      - name: square_meters
        description: Total floor area of the store converted to an integer value.
 
      - name: open_date
        description: Date the store began operations, converted to the DATE data type.
        data_tests:
          - not_null:
              description: To preserve history, this test ensures every store has an open date.
              config:
                severity: error

  - name: silver_sales_details
    description: Standardized version of the sales data, sourced from the Sales model in the bronze layer for downstream analytics.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - line_item
          description: Validates that one order id equals to one order line in a row.


    columns: 
      - name: order_id
        description: >
          Unique identifier of an order placed by a customer, sourced from OrderNumber in the bronze layer. 
          Not unique on its own — combine with line_item for the row-level key, as one order can span multiple product lines.
        data_tests:
          - not_null:
              description: Every order placed by a customer must have an order id.
              config:
                severity: error

      - name: line_item
        description: >
          Line number identifying a product line within an order, sourced from the LineItem column in the bronze layer. 
          Orders with multiple products produce order_id it forms the natural composite key of this table (order_id alone
          repeats for multi-line orders). Expected to be an integer sequence (1, 2, 3,...) per order; 
          it is not unique on its own and does not identify the product — see product_id for that.
        data_tests: 
          - not_null: 
              description: Validates that an order line must be attributable to an order.
              config:
                severity: error

      - name: order_date
        description: >
          Date the order was placed, passed through from the OrderDate column in the bronze sales layer (data type: DATE). 
          Repeats across all line items of thesame order since this model is at order-line grain. Use for time-based
          sales analysis (e.g., daily or monthly trends).
        data_tests:
          - not_null:
              description: Confirms that every order must have an order date.
              config:
                severity: error

      - name: delivery_date
        description: >
          Delivery date of the order line. NULL for offline sales — offline orders
          are not delivered, so this column is legitimately nullable (see
          fact_offline_sales, which splits online/offline on this flag).
        
      - name: customer_id
        description: >
          Foreign key to the customer dimension, sourced fromthe CustomerKey column in the bronze layer. 
          Identifies the customer who placed the order. 
          Not unique in this model — the grain is one row per order line, so a customer with multiple order lines appears in multiple rows. 
          Inherits the source data type (numeric integer key); no transformation is applied.
        data_tests:
          - not_null: 
              description: Every order line must be attributable to a customer.
              config:
                severity: error
        
      - name: store_id
        description: >
          Foreign key to the stores dimension, sourced from StoreKey in the bronze layer. 
          Can't be unique on this model as the store id could have multiple orders.
        data_tests:
          - not_null:
              description: Validates that every store has an id.
              config:
                severity: error

      - name: product_id
        description: >
          Foreign key to the product dimension, sourced from ProductKey in the bronze layer. 
          Can't be unique on this model as customers could place orders on same product multiple times.
        data_tests:
          - not_null:
              description: This test ensure that every product id is attributed to a product
              config:
                severity: error

      - name: quantity
        description: >
          Identifies how many products a customer placed on any store id, sourced from Quantity in the bronze layer.
        data_tests:
          - not_null:
              description: Ensures that every order is attributable to a customer
              config:
                severity: error
          - test_negative_values:
              arguments:
                column_name: quantity
              description: Ensures that quantities can't be less or equal to 0 or have negative values.
              config:
                severity: error

      - name: currency_code
        description: Identifies the currency each customer made payment with, sourced from Currency in the bronze layer.
        data_tests:
          - not_null:
              description: Customers makes payment when they places an order ensures that currency is attributable to a customer.
              config:
                severity: error

  - name: silver_exchange_rates
    description: >
      Contains standardized exchange rate records derived from the seed data.
      Data types are converted to support consistent currency conversions in downstream analytical models.

    columns:
      - name: date
        description: Date on which the exchange rate is effective.
        data_tests:
          - not_null:
              description: Ensures that every exchange rate record includes an effective date.
              config:
                severity: warn

      - name: currency
        description: Currency code associated with the exchange rate.
        data_tests:
          - not_null:
              description: Ensures that every exchange rate record is associated with a valid currency code.
              config:
                severity: error

      - name: exchange_rates
        description: Exchange rate converted to a numeric value relative to the U.S. dollar (USD).
        data_tests:
          - not_null:
              description: Verifies that every exchange rate record contains a conversion value for downstream calculations.
              config:
                severity: error


      




