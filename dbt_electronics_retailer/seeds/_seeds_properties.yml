seeds:
  - name: Exchange_Rates
    description: >
      Reference dataset containing historical currency exchange rates used to convert 
      monetary values into a common reporting currency.

    columns:
      - name: Date
        description: Date on which the exchange rate is effective.

      - name: Currency
        description: Currency code for which the exchange rate is recorded.

      - name: Exchange
        description: Exchange rate relative to the U.S. dollar (USD).

  - name: Stores
    description: This contains the details of where the company stores are located

    columns:
      - name: StoreKey
        description: Primary key to identify stores

      - name: Country
        description: Contains the country where the stores are located

      - name: State
        description: Contains the state of the country where the stores are located

      - name: SquareMeters
        description: Store footprint in square meters

      - name: OpenDate
        description: Store open date



